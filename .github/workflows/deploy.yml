name: Compilar y publicar en Docker para NAS

on:
  push:
    branches: [ main ]

env:
  # Escribe aquí en minúsculas tu usuario de GitHub y el nombre de tu repositorio
  IMAGE_NAME: ghcr.io/pepeluso78/cuadernoinspector:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
